version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    cooldown:
      default-days: 10
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      all-bundler:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10
    groups:
      all-npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
    open-pull-requests-limit: 10
